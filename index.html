<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球淨化工程 - 寶石數量智能記錄與分析系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-900/50 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl shadow-inner">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide text-white flex items-center gap-2">
                        地球淨化工程
                        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium">VIP ×3 啟用中</span>
                    </h1>
                    <p class="text-xs text-gray-400">常駐活動寶石獲得數量智能記錄與分析系統</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="max-w-3xl mx-auto px-4 mt-4">
        <div class="grid grid-cols-4 gap-2 bg-gray-900/80 p-1.5 rounded-2xl border border-gray-800 text-sm">
            <button onclick="switchTab('daily')" id="tab-daily" class="py-2.5 rounded-xl font-medium transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg">
                <i class="fa-solid fa-pen-to-square"></i> 每日記錄
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="py-2.5 rounded-xl font-medium transition flex items-center justify-center gap-2 text-gray-400 hover:text-white">
                <i class="fa-solid fa-table-list"></i> 歷史記錄
            </button>
            <button onclick="switchTab('chart')" id="tab-chart" class="py-2.5 rounded-xl font-medium transition flex items-center justify-center gap-2 text-gray-400 hover:text-white">
                <i class="fa-solid fa-chart-line"></i> 趨勢圖表
            </button>
            <button onclick="switchTab('backup')" id="tab-backup" class="py-2.5 rounded-xl font-medium transition flex items-center justify-center gap-2 text-gray-400 hover:text-white">
                <i class="fa-solid fa-database"></i> 備份/還原
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 mt-4">

        <!-- 1. 每日記錄 Tab -->
        <section id="view-daily" class="space-y-4">
            <!-- 日期選擇 -->
            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
                <label class="text-sm font-medium text-gray-300 flex items-center gap-2">
                    <i class="fa-regular fa-calendar text-emerald-400"></i> 記錄日期
                </label>
                <input type="date" id="record-date" onchange="loadDateRecord()" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-white text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <!-- 當天前後寶石數量 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center justify-between">
                        <span>當天一開始寶石數量 (X)</span>
                        <span class="text-[10px] text-emerald-400">參考用</span>
                    </label>
                    <input type="number" id="start-gems" placeholder="例如: 5134" oninput="handleStartEndInput()" class="w-full bg-gray-800/80 border border-gray-700/80 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition text-lg font-mono">
                </div>
                <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center justify-between">
                        <span>最後打完五場寶石數量 (Y)</span>
                        <span class="text-[10px] text-emerald-400">參考用</span>
                    </label>
                    <input type="number" id="end-gems" placeholder="例如: 11857" oninput="handleStartEndInput()" class="w-full bg-gray-800/80 border border-gray-700/80 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition text-lg font-mono">
                </div>
            </div>

            <!-- 五場活動原始寶石掉落量 -->
            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-semibold text-gray-200 flex items-center gap-2">
                        <i class="fa-solid fa-gamepad text-emerald-400"></i> 五場活動原始寶石掉落量 (每場)
                    </label>
                    <span class="text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded-lg">每場自動乘以 3 (VIP加成)</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                    <div>
                        <span class="text-xs text-gray-400 block mb-1">第 1 場</span>
                        <input type="number" id="run-0" placeholder="原始量" oninput="handleRunInput()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm text-center font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <span class="text-xs text-gray-400 block mb-1">第 2 場</span>
                        <input type="number" id="run-1" placeholder="原始量" oninput="handleRunInput()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm text-center font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <span class="text-xs text-gray-400 block mb-1">第 3 場</span>
                        <input type="number" id="run-2" placeholder="原始量" oninput="handleRunInput()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm text-center font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <span class="text-xs text-gray-400 block mb-1">第 4 場</span>
                        <input type="number" id="run-3" placeholder="原始量" oninput="handleRunInput()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm text-center font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <span class="text-xs text-gray-400 block mb-1">第 5 場</span>
                        <input type="number" id="run-4" placeholder="原始量" oninput="handleRunInput()" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm text-center font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
            </div>

            <!-- 綜合計算結果 (左右雙欄：左未乘3，右VIPx3) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 平均每場獲得數量 -->
                <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">平均每場獲得數量</label>
                        <span class="text-[10px] text-gray-400">可逆向推算</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-gray-800/60 border border-gray-700/60 rounded-xl p-2.5 text-center">
                            <span class="text-[10px] text-gray-400 block mb-0.5">未乘 3 (原始)</span>
                            <input type="number" id="avg-raw" placeholder="例如: 70" oninput="handleAverageInput('raw')" class="w-full bg-gray-900/90 border border-gray-700 rounded-lg py-1.5 px-2 text-center text-white text-sm font-mono focus:outline-none focus:border-emerald-500">
                        </div>
                        <div class="bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-2.5 text-center">
                            <span class="text-[10px] text-emerald-400 block mb-0.5">含 VIP ×3</span>
                            <input type="number" id="avg-vip" placeholder="例如: 210" oninput="handleAverageInput('vip')" class="w-full bg-gray-900/90 border border-emerald-500/50 rounded-lg py-1.5 px-2 text-center text-emerald-300 text-sm font-mono focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                </div>

                <!-- 總獲得寶石數量 -->
                <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">總獲得寶石數量</label>
                        <span class="text-[10px] text-gray-400">可逆向推算</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-gray-800/60 border border-gray-700/60 rounded-xl p-2.5 text-center">
                            <span class="text-[10px] text-gray-400 block mb-0.5">未乘 3 (原始)</span>
                            <input type="number" id="total-raw" placeholder="例如: 350" oninput="handleTotalInput('raw')" class="w-full bg-gray-900/90 border border-gray-700 rounded-lg py-1.5 px-2 text-center text-white text-sm font-mono focus:outline-none focus:border-emerald-500">
                        </div>
                        <div class="bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-2.5 text-center">
                            <span class="text-[10px] text-emerald-400 block mb-0.5">含 VIP ×3</span>
                            <input type="number" id="total-vip" placeholder="例如: 1050" oninput="handleTotalInput('vip')" class="w-full bg-gray-900/90 border border-emerald-500/50 rounded-lg py-1.5 px-2 text-center text-emerald-300 text-sm font-mono focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 錯誤與衝突提示訊息區 -->
            <div id="error-container" class="hidden bg-red-950/60 border border-red-500/50 rounded-2xl p-4 text-red-200 text-sm flex items-start gap-3 shadow-lg">
                <i class="fa-solid fa-triangle-exclamation text-red-400 mt-0.5 text-lg"></i>
                <div class="space-y-1">
                    <span class="font-bold block text-red-300">資料衝突或輸入錯誤</span>
                    <p id="error-message" class="text-xs text-red-300/90 leading-relaxed"></p>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex gap-3 pt-2">
                <button onclick="saveCurrentRecord()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> 儲存今日記錄
                </button>
                <button onclick="clearCurrentForm()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-3 px-5 rounded-2xl border border-gray-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 清空重填
                </button>
            </div>
        </section>

        <!-- 2. 歷史記錄 Tab -->
        <section id="view-history" class="hidden space-y-4">
            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg">
                <h3 class="text-sm font-semibold text-gray-200 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-table-list text-emerald-400"></i> 歷史記錄列表
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-800/80 text-gray-400 uppercase text-[11px] tracking-wider">
                            <tr>
                                <th class="p-3 rounded-l-xl">日期</th>
                                <th class="p-3 text-center">總獲得 (VIP×3)</th>
                                <th class="p-3 text-center">平均每場 (VIP×3)</th>
                                <th class="p-3 text-center rounded-r-xl">操作</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="divide-y divide-gray-800 text-gray-300">
                            <!-- 動態渲染 -->
                        </tbody>
                    </table>
                </div>
                <div id="no-history" class="text-center py-8 text-gray-500 text-sm hidden">
                    目前尚無任何歷史記錄，請前往「每日記錄」新增。
                </div>
            </div>
        </section>

        <!-- 3. 趨勢圖表 Tab -->
        <section id="view-chart" class="hidden space-y-4">
            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-emerald-400"></i> 寶石獲得趨勢分析
                    </h3>
                    <span class="text-xs text-gray-400">滑鼠移上去可查看詳細數量</span>
                </div>
                <div class="relative h-72 w-full">
                    <canvas id="gemChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 4. 備份/還原 Tab -->
        <section id="view-backup" class="hidden space-y-4">
            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-lg space-y-4">
                <h3 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-database text-emerald-400"></i> 數據備份與還原
                </h3>
                <p class="text-xs text-gray-400 leading-relaxed">
                    您可以將所有歷史記錄匯出為 JSON 檔案進行備份，或匯入先前備份的檔案來還原資料。
                </p>
                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <button onclick="exportData()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-file-arrow-down"></i> 匯出備份檔案 (JSON)
                    </button>
                    <label class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold py-3 px-4 rounded-xl border border-gray-700 cursor-pointer transition flex items-center justify-center gap-2 text-center">
                        <i class="fa-solid fa-file-arrow-up"></i> 匯入還原檔案
                        <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>
            </div>
        </section>

    </main>

    <script>
        let records = JSON.parse(localStorage.getItem('earth_cleaning_records') || '{}');
        let currentChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            const todayStr = getLocalDateString(new Date());
            document.getElementById('record-date').value = todayStr;
            loadDateRecord();
            switchTab('daily');
        });

        function getLocalDateString(date) {
            const offset = date.getTimezoneOffset();
            const localDate = new Date(date.getTime() - (offset*60*1000));
            return localDate.toISOString().split('T')[0];
        }

        function switchTab(tabName) {
            ['daily', 'history', 'chart', 'backup'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "py-2.5 rounded-xl font-medium transition flex items-center justify-center gap-2 text-gray-400 hover:text-white";
            });
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).className = "py-2.5 rounded-xl font-medium transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg";

            if (tabName === 'history') renderHistory();
            if (tabName === 'chart') renderChart();
        }

        function getFormData() {
            const startGems = parseFloat(document.getElementById('start-gems').value);
            const endGems = parseFloat(document.getElementById('end-gems').value);
            const runs = [];
            for (let i = 0; i < 5; i++) {
                const val = parseFloat(document.getElementById(`run-${i}`).value);
                runs.push(isNaN(val) ? null : val);
            }
            const avgRaw = parseFloat(document.getElementById('avg-raw').value);
            const avgVip = parseFloat(document.getElementById('avg-vip').value);
            const totalRaw = parseFloat(document.getElementById('total-raw').value);
            const totalVip = parseFloat(document.getElementById('total-vip').value);

            return {
                date: document.getElementById('record-date').value,
                startGems: isNaN(startGems) ? null : startGems,
                endGems: isNaN(endGems) ? null : endGems,
                runs,
                avgRaw: isNaN(avgRaw) ? null : avgRaw,
                avgVip: isNaN(avgVip) ? null : avgVip,
                totalRaw: isNaN(totalRaw) ? null : totalRaw,
                totalVip: isNaN(totalVip) ? null : totalVip
            };
        }

        function showError(msg) {
            const container = document.getElementById('error-container');
            const msgEl = document.getElementById('error-message');
            if (msg) {
                msgEl.textContent = msg;
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        let isUpdating = false;

        function updateUIValues(data, errorText = null) {
            if (isUpdating) return;
            isUpdating = true;

            if (data.startGems !== null) document.getElementById('start-gems').value = data.startGems;
            if (data.endGems !== null) document.getElementById('end-gems').value = data.endGems;
            
            data.runs.forEach((val, i) => {
                document.getElementById(`run-${i}`).value = val !== null ? val : '';
            });

            document.getElementById('avg-raw').value = data.avgRaw !== null ? Number(data.avgRaw.toFixed(2)) : '';
            document.getElementById('avg-vip').value = data.avgVip !== null ? Number(data.avgVip.toFixed(2)) : '';
            document.getElementById('total-raw').value = data.totalRaw !== null ? Number(data.totalRaw.toFixed(2)) : '';
            document.getElementById('total-vip').value = data.totalVip !== null ? Number(data.totalVip.toFixed(2)) : '';

            showError(errorText);
            isUpdating = false;
        }

        // 1. 當輸入 Start (X) / End (Y) 時的計算
        function handleStartEndInput() {
            if (isUpdating) return;
            const start = parseFloat(document.getElementById('start-gems').value);
            const end = parseFloat(document.getElementById('end-gems').value);
            const runs = [];
            for (let i = 0; i < 5; i++) {
                const val = parseFloat(document.getElementById(`run-${i}`).value);
                runs.push(isNaN(val) ? null : val);
            }

            let error = null;
            let totalVip = null, totalRaw = null, avgVip = null, avgRaw = null;

            if (!isNaN(start) && !isNaN(end)) {
                totalVip = end - start;
                totalRaw = totalVip / 3;
                avgVip = totalVip / 5;
                avgRaw = avgVip / 3;

                if (totalVip < 0) {
                    error = "注意：結束寶石數量小於開始數量，差值為負數。";
                }

                // 檢查是否與已填寫的場次總和衝突
                const filledRunsSum = runs.reduce((acc, cur) => acc + (cur !== null ? cur * 3 : 0), 0);
                const filledCount = runs.filter(v => v !== null).length;
                if (filledCount === 5 && Math.abs(filledRunsSum - totalVip) > 1e-5) {
                    error = `資料衝突：5場原始掉落量總和×3 (${filledRunsSum}) 與 (最後數量 - 開始數量) (${totalVip}) 不符！`;
                }
            }

            // 如果沒有填 Start/End，但有填 5 場
            const filledCount = runs.filter(v => v !== null).length;
            if (isNaN(start) || isNaN(end)) {
                if (filledCount > 0) {
                    const sumVip = runs.reduce((acc, cur) => acc + (cur !== null ? cur * 3 : 0), 0);
                    totalVip = sumVip;
                    totalRaw = sumVip / 3;
                    avgVip = sumVip / 5;
                    avgRaw = avgVip / 3;
                }
            }

            updateUIValues({
                startGems: isNaN(start) ? null : start,
                endGems: isNaN(end) ? null : end,
                runs,
                avgRaw, avgVip, totalRaw, totalVip
            }, error);
        }

        // 2. 當輸入每場原始量時的計算
        function handleRunInput() {
            if (isUpdating) return;
            const start = parseFloat(document.getElementById('start-gems').value);
            const end = parseFloat(document.getElementById('end-gems').value);
            const runs = [];
            for (let i = 0; i < 5; i++) {
                const val = parseFloat(document.getElementById(`run-${i}`).value);
                runs.push(isNaN(val) ? null : val);
            }

            let error = null;
            let totalVip = null, totalRaw = null, avgVip = null, avgRaw = null;

            const filledCount = runs.filter(v => v !== null).length;
            const sumVip = runs.reduce((acc, cur) => acc + (cur !== null ? cur * 3 : 0), 0);

            if (filledCount > 0) {
                totalVip = sumVip;
                totalRaw = sumVip / 3;
                avgVip = sumVip / 5;
                avgRaw = avgVip / 3;
            }

            if (!isNaN(start) && !isNaN(end)) {
                const expectedTotal = end - start;
                if (filledCount === 5 && Math.abs(sumVip - expectedTotal) > 1e-5) {
                    error = `資料衝突：5場總量×3 (${sumVip}) 與 (結束數量 - 開始數量) (${expectedTotal}) 不符！`;
                }
            }

            updateUIValues({
                startGems: isNaN(start) ? null : start,
                endGems: isNaN(end) ? null : end,
                runs,
                avgRaw, avgVip, totalRaw, totalVip
            }, error);
        }

        // 3. 當輸入平均數值時的逆向推算
        function handleAverageInput(type) {
            if (isUpdating) return;
            let avgVip = parseFloat(document.getElementById('avg-vip').value);
            let avgRaw = parseFloat(document.getElementById('avg-raw').value);

            if (type === 'vip' && !isNaN(avgVip)) {
                avgRaw = avgVip / 3;
            } else if (type === 'raw' && !isNaN(avgRaw)) {
                avgVip = avgRaw * 3;
            } else {
                avgVip = null; avgRaw = null;
            }

            const totalVip = avgVip !== null ? avgVip * 5 : null;
            const totalRaw = avgRaw !== null ? avgRaw * 5 : null;
            const runs = [null, null, null, null, null];

            const start = parseFloat(document.getElementById('start-gems').value);
            const end = parseFloat(document.getElementById('end-gems').value);

            updateUIValues({
                startGems: isNaN(start) ? null : start,
                endGems: isNaN(end) ? null : end,
                runs,
                avgRaw, avgVip, totalRaw, totalVip
            }, null);
        }

        // 4. 當輸入總獲得數值時的逆向推算
        function handleTotalInput(type) {
            if (isUpdating) return;
            let totalVip = parseFloat(document.getElementById('total-vip').value);
            let totalRaw = parseFloat(document.getElementById('total-raw').value);

            if (type === 'vip' && !isNaN(totalVip)) {
                totalRaw = totalVip / 3;
            } else if (type === 'raw' && !isNaN(totalRaw)) {
                totalVip = totalRaw * 3;
            } else {
                totalVip = null; totalRaw = null;
            }

            const avgVip = totalVip !== null ? totalVip / 5 : null;
            const avgRaw = totalRaw !== null ? totalRaw / 5 : null;
            const runs = [null, null, null, null, null];

            const start = parseFloat(document.getElementById('start-gems').value);
            const end = parseFloat(document.getElementById('end-gems').value);

            updateUIValues({
                startGems: isNaN(start) ? null : start,
                endGems: isNaN(end) ? null : end,
                runs,
                avgRaw, avgVip, totalRaw, totalVip
            }, null);
        }

        function loadDateRecord() {
            const date = document.getElementById('record-date').value;
            const rec = records[date];
            if (rec) {
                updateUIValues({
                    startGems: rec.startGems,
                    endGems: rec.endGems,
                    runs: rec.runs,
                    avgRaw: rec.avgRaw,
                    avgVip: rec.avgVip,
                    totalRaw: rec.totalRaw,
                    totalVip: rec.totalVip
                });
            } else {
                clearCurrentForm(false);
            }
        }

        function saveCurrentRecord() {
            const date = document.getElementById('record-date').value;
            if (!date) {
                alert('請先選擇日期！');
                return;
            }
            const data = getFormData();
            records[date] = data;
            localStorage.setItem('earth_cleaning_records', JSON.stringify(records));
            alert('已成功儲存今日記錄！');
        }

        function clearCurrentForm(resetDate = true) {
            if (resetDate) {
                document.getElementById('record-date').value = getLocalDateString(new Date());
            }
            document.getElementById('start-gems').value = '';
            document.getElementById('end-gems').value = '';
            for(let i=0; i<5; i++) document.getElementById(`run-${i}`).value = '';
            document.getElementById('avg-raw').value = '';
            document.getElementById('avg-vip').value = '';
            document.getElementById('total-raw').value = '';
            document.getElementById('total-vip').value = '';
            showError(null);
        }

        function renderHistory() {
            const tbody = document.getElementById('history-table-body');
            const noHistory = document.getElementById('no-history');
            tbody.innerHTML = '';

            const dates = Object.keys(records).sort().reverse();
            if (dates.length === 0) {
                noHistory.classList.remove('hidden');
                return;
            }
            noHistory.classList.add('hidden');

            dates.forEach(date => {
                const rec = records[date];
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/50 transition";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-white">${date}</td>
                    <td class="p-3 text-center font-mono text-emerald-400">${rec.totalVip !== null ? rec.totalVip : '-'}</td>
                    <td class="p-3 text-center font-mono">${rec.avgVip !== null ? Number(rec.avgVip.toFixed(2)) : '-'}</td>
                    <td class="p-3 text-center">
                        <button onclick="loadRecordToEdit('${date}')" class="text-xs bg-gray-800 hover:bg-emerald-600 text-gray-300 hover:text-white px-3 py-1 rounded-lg transition mr-1">編輯</button>
                        <button onclick="deleteRecord('${date}')" class="text-xs bg-gray-800 hover:bg-red-600 text-gray-300 hover:text-white px-3 py-1 rounded-lg transition">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function loadRecordToEdit(date) {
            document.getElementById('record-date').value = date;
            loadDateRecord();
            switchTab('daily');
        }

        function deleteRecord(date) {
            if (confirm(`確定要刪除 ${date} 的記錄嗎？`)) {
                delete records[date];
                localStorage.setItem('earth_cleaning_records', JSON.stringify(records));
                renderHistory();
            }
        }

        function renderChart() {
            const ctx = document.getElementById('gemChart').getContext('2d');
            const dates = Object.keys(records).sort();
            const totals = dates.map(d => records[d].totalVip || 0);
            const avgs = dates.map(d => records[d].avgVip || 0);

            if (currentChart) {
                currentChart.destroy();
            }

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: '總獲得寶石數量 (含 VIP×3)',
                            data: totals,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true,
                            yAxisID: 'y'
                        },
                        {
                            label: '平均每場獲得數量 (含 VIP×3)',
                            data: avgs,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#9ca3af',
                                font: { size: 11 }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.9)',
                            titleColor: '#f3f4f6',
                            bodyColor: '#d1d5db',
                            borderColor: '#374151',
                            borderWidth: 1,
                            padding: 10,
                            boxPadding: 4,
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(31, 41, 55, 0.5)' },
                            ticks: { color: '#9ca3af', font: { size: 10 } }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            grid: { color: 'rgba(31, 41, 55, 0.5)' },
                            ticks: { color: '#10b981', font: { size: 10 } }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#3b82f6', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `earth_cleaning_gems_${getLocalDateString(new Date())}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (typeof imported === 'object' && imported !== null) {
                        records = imported;
                        localStorage.setItem('earth_cleaning_records', JSON.stringify(records));
                        alert('資料還原成功！');
                        loadDateRecord();
                    } else {
                        alert('檔案格式錯誤！');
                    }
                } catch (err) {
                    alert('解析 JSON 失敗：' + err);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
